<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Manager</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #242424;
      --bg-hover: #2a2a2a;
      --border-subtle: rgba(255, 255, 255, 0.15);
      --text-primary: #ffffff;
      --text-secondary: #c0c0c0;
      --text-muted: #808080;
      --success: #4ade80;
      --error: #f87171;
      --font-mono: 'Space Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-mono);
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .app-header {
      height: 44px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      overflow-x: auto;
      max-width: 60%;
    }

    .breadcrumb-item {
      padding: 4px 8px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: color 120ms ease;
    }

    .breadcrumb-item:hover {
      color: var(--text-primary);
    }

    .breadcrumb-separator {
      color: var(--text-muted);
      font-weight: 700;
    }

    .file-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .file-header {
      display: grid;
      grid-template-columns: 1fr 100px 150px 80px;
      gap: 12px;
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 6px;
    }

    .file-item {
      display: grid;
      grid-template-columns: 1fr 100px 150px 80px;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-secondary);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .file-item:hover {
      background: var(--bg-hover);
      border-color: var(--border-subtle);
    }

    .file-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-primary);
      overflow: hidden;
    }

    .file-name span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }

    .file-item.folder .file-name svg {
      color: var(--success);
    }

    .file-size,
    .file-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .file-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      transition: color 120ms ease;
    }

    .action-btn:hover {
      color: var(--text-primary);
    }

    .action-btn.delete:hover {
      color: var(--error);
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      padding: 24px;
      min-width: 320px;
      max-width: 90vw;
    }

    .modal-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    .modal-message {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      margin-bottom: 20px;
      outline: none;
    }

    .modal-input:focus {
      border-color: var(--text-muted);
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 8px 16px;
      background: var(--bg-tertiary);
      border: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 120ms ease;
    }

    .modal-btn:hover {
      background: var(--bg-hover);
    }

    .modal-btn.danger {
      background: var(--error);
      color: var(--bg-primary);
    }

    .modal-btn.danger:hover {
      background: #ef4444;
    }

    .modal-btn.primary {
      background: var(--success);
      color: var(--bg-primary);
    }

    .modal-btn.primary:hover {
      background: #22c55e;
    }

    .context-menu {
      display: none;
      position: fixed;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      min-width: 140px;
      z-index: 999;
    }

    .context-menu.visible {
      display: block;
    }

    .context-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }

    .context-menu-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .context-menu-item.danger:hover {
      color: var(--error);
    }

    .context-menu-item svg {
      width: 14px;
      height: 14px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .file-header,
      .file-item {
        grid-template-columns: 1fr 60px;
      }

      .file-date,
      .file-header > *:nth-child(3) {
        display: none;
      }

      .file-size,
      .file-header > *:nth-child(2) {
        display: none;
      }

      .file-actions {
        justify-content: flex-end;
      }

      .breadcrumb {
        max-width: 50%;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-title">File Manager</div>
    </header>

    <div class="file-list-container">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <div class="file-list" id="file-list">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <div class="context-menu" id="context-menu">
    <div class="context-menu-item" data-action="rename">
      <i data-lucide="pencil"></i>
      <span>Rename</span>
    </div>
    <div class="context-menu-item danger" data-action="delete">
      <i data-lucide="trash-2"></i>
      <span>Delete</span>
    </div>
  </div>

  <div class="modal-overlay" id="rename-modal">
    <div class="modal">
      <div class="modal-title">Rename</div>
      <input type="text" class="modal-input" id="rename-input" placeholder="New name">
      <div class="modal-buttons">
        <button class="modal-btn" onclick="closeRenameModal()">Cancel</button>
        <button class="modal-btn primary" onclick="confirmRename()">Rename</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="delete-modal">
    <div class="modal">
      <div class="modal-title">Delete</div>
      <div class="modal-message" id="delete-message">Are you sure you want to delete this item?</div>
      <div class="modal-buttons">
        <button class="modal-btn" onclick="closeDeleteModal()">Cancel</button>
        <button class="modal-btn danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script>
    let currentPath = '';
    let files = [];
    let selectedFile = null;

    async function fetchFiles(path) {
      try {
        const apiPath = path === '/' ? '' : path.replace(/^\//, '');
        const res = await fetch(`/api/files?path=${encodeURIComponent(apiPath)}`);
        if (!res.ok) throw new Error('Failed to fetch files');
        return await res.json();
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    function formatSize(bytes) {
      if (bytes === undefined || bytes === null) return '-';
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function renderBreadcrumb() {
      const breadcrumb = document.getElementById('breadcrumb');
      const parts = currentPath.split('/').filter(Boolean);

      let html = `<button class="breadcrumb-item" data-path="">/</button>`;

      let accPath = '';
      parts.forEach((part, i) => {
        accPath += '/' + part;
        html += `<span class="breadcrumb-separator">/</span>`;
        html += `<button class="breadcrumb-item" data-path="${accPath.slice(1)}">${part}</button>`;
      });

      breadcrumb.innerHTML = html;

      breadcrumb.querySelectorAll('.breadcrumb-item').forEach(btn => {
        btn.addEventListener('click', () => {
          navigateTo(btn.dataset.path);
        });
      });
    }

    function renderFiles() {
      const list = document.getElementById('file-list');

      if (files.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <i data-lucide="folder-open"></i>
            <span>This folder is empty</span>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const sorted = [...files].sort((a, b) => {
        if (a.isFolder && !b.isFolder) return -1;
        if (!a.isFolder && b.isFolder) return 1;
        return a.name.localeCompare(b.name);
      });

      list.innerHTML = sorted.map(file => `
        <div class="file-item ${file.isFolder ? 'folder' : ''}" 
             data-name="${file.name}" 
             data-path="${file.path}"
             data-is-dir="${file.isFolder}">
          <div class="file-name">
            <i data-lucide="${file.isFolder ? 'folder' : 'file'}"></i>
            <span>${file.name}</span>
          </div>
          <div class="file-size">${file.isFolder ? '-' : formatSize(file.size)}</div>
          <div class="file-date">${formatDate(file.modified)}</div>
          <div class="file-actions">
            <button class="action-btn" data-action="rename" title="Rename">
              <i data-lucide="pencil"></i>
            </button>
            <button class="action-btn delete" data-action="delete" title="Delete">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();

      list.querySelectorAll('.file-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.closest('.action-btn')) return;
          if (item.dataset.isDir === 'true') {
            navigateTo(item.dataset.path);
          }
        });

        item.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          showContextMenu(e.clientX, e.clientY, item.dataset.name, item.dataset.path);
        });

        item.querySelectorAll('.action-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedFile = { name: item.dataset.name, path: item.dataset.path };
            if (btn.dataset.action === 'rename') {
              openRenameModal();
            } else if (btn.dataset.action === 'delete') {
              openDeleteModal();
            }
          });
        });
      });
    }

    async function navigateTo(path) {
      currentPath = path;
      renderBreadcrumb();
      document.getElementById('file-list').innerHTML = '<div class="loading">Loading...</div>';
      files = await fetchFiles(path);
      renderFiles();
    }

    function showContextMenu(x, y, name, path) {
      selectedFile = { name, path };
      const menu = document.getElementById('context-menu');
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
      menu.classList.add('visible');
    }

    function hideContextMenu() {
      document.getElementById('context-menu').classList.remove('visible');
    }

    function openRenameModal() {
      hideContextMenu();
      const modal = document.getElementById('rename-modal');
      const input = document.getElementById('rename-input');
      input.value = selectedFile.name;
      modal.classList.add('visible');
      input.focus();
      input.select();
    }

    function closeRenameModal() {
      document.getElementById('rename-modal').classList.remove('visible');
      selectedFile = null;
    }

    async function confirmRename() {
      const newName = document.getElementById('rename-input').value.trim();
      if (!newName || !selectedFile) return;

      const oldPath = selectedFile.path;
      const pathParts = oldPath.split('/');
      pathParts.pop();
      const newPath = pathParts.join('/') + '/' + newName;

      try {
        const res = await fetch('/api/files/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ oldPath, newPath })
        });
        if (!res.ok) throw new Error('Rename failed');
        closeRenameModal();
        await navigateTo(currentPath);
      } catch (e) {
        console.error(e);
        alert('Failed to rename');
      }
    }

    function openDeleteModal() {
      hideContextMenu();
      const modal = document.getElementById('delete-modal');
      const message = document.getElementById('delete-message');
      message.textContent = `Are you sure you want to delete "${selectedFile.name}"?`;
      modal.classList.add('visible');
    }

    function closeDeleteModal() {
      document.getElementById('delete-modal').classList.remove('visible');
      selectedFile = null;
    }

    async function confirmDelete() {
      if (!selectedFile) return;

      try {
        const res = await fetch(`/api/files/${encodeURIComponent(selectedFile.path)}`, {
          method: 'DELETE'
        });
        if (!res.ok) throw new Error('Delete failed');
        closeDeleteModal();
        await navigateTo(currentPath);
      } catch (e) {
        console.error(e);
        alert('Failed to delete');
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.context-menu')) {
        hideContextMenu();
      }
    });

    document.getElementById('context-menu').querySelectorAll('.context-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'rename') {
          openRenameModal();
        } else if (item.dataset.action === 'delete') {
          openDeleteModal();
        }
      });
    });

    document.getElementById('rename-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmRename();
      if (e.key === 'Escape') closeRenameModal();
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.remove('visible');
          selectedFile = null;
        }
      });
    });

    document.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await navigateTo('/');
    });
  </script>
</body>
</html>

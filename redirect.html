    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.2;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.5s forwards;
  }

  .subtitle {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.35);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.7s forwards;
  }

  .bar-track {
    margin-top: 24px;
    width: min(280px, 60vw);
    height: 2px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 1px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.9s forwards;
  }

  .bar-fill {
    height: 100%;
    width: 30%;
    background: linear-gradient(90deg, #c084fc, #e9d5ff);
    border-radius: 1px;
    animation: indeterminate 1.8s ease-in-out infinite;
  }

  @keyframes indeterminate {
    0% { transform: translateX(-100%); width: 30%; }
    50% { width: 50%; }
    100% { transform: translateX(400%); width: 30%; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="gradient"></div>
<div class="content">
  <div class="title">Redirecting you...</div>
  <div class="subtitle" id="sub">Waiting for tunnel to come online</div>
  <div class="bar-track"><div class="bar-fill"></div></div>
</div>
<script>
(function() {
  var pollUrl = "{{POLL_URL}}";
  var attempts = 0;

  var tunnelUrl = null;
  var redirected = false;
  var animationDone = false;
  var minDelay = 3000;
  var subtitleEl = document.getElementById("sub");

  setTimeout(function() {
    animationDone = true;
    if (tunnelUrl) verifyAndRedirect(tunnelUrl);
  }, minDelay);

  function addDnsPrefetch(url) {
    try {
      var a = document.createElement("a");
      a.href = url;
      var link = document.createElement("link");
      link.rel = "dns-prefetch";
      link.href = "//" + a.hostname;
      document.head.appendChild(link);
      var preconnect = document.createElement("link");
      preconnect.rel = "preconnect";
      preconnect.href = a.protocol + "//" + a.hostname;
      document.head.appendChild(preconnect);
    } catch(e) {}
  }

  var prefetched = false;

  function queueRedirect(url) {
    if (!url) return;
    tunnelUrl = url;
    if (!prefetched) { prefetched = true; addDnsPrefetch(url); }
    if (animationDone) verifyAndRedirect(url);
  }

  function verifyAndRedirect(url, retries) {
    if (redirected) return;
    retries = retries || 0;
    if (subtitleEl) subtitleEl.textContent = "Verifying tunnel is reachable...";
    fetch(url, { mode: "no-cors", cache: "no-store" })
      .then(function() {
        redirectNow(url);
      })
      .catch(function() {
        if (retries < 15) {
          setTimeout(function() { verifyAndRedirect(url, retries + 1); }, 2000);
        } else {
          redirectNow(url);
        }
      });
  }

  function redirectNow(url) {
    if (redirected) return;
    redirected = true;
    if (subtitleEl) subtitleEl.textContent = "Tunnel ready. Redirecting...";
    window.location.replace(url);
  }

  function poll() {
    if (!pollUrl) {
      if (subtitleEl) subtitleEl.textContent = "Waiting for launch endpoint...";
      setTimeout(poll, 2000);
      return;
    }

    attempts++;
    if (attempts > 10 && subtitleEl) {
      subtitleEl.textContent = "Taking a moment longer than usual...";
    }

    var separator = pollUrl.indexOf("?") === -1 ? "?" : "&";
    fetch(pollUrl + separator + "ts=" + Date.now(), { cache: "no-store" })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.url && data.status === "running") {
          queueRedirect(data.url);
        } else {
          setTimeout(poll, 2000);
        }
      })
      .catch(function() {
        setTimeout(poll, 2000);
      });
  }

  poll();
})();
</script>
</body>
</html>
